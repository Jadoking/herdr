# Herdr v0.9.0 — tmux-compatible transition profile
# tmux remains installed for existing automation and Collie during migration.

[theme]
name = "rose-pine"

[terminal]
default_shell = "zsh"
shell_mode = "non_login"
new_cwd = "follow"

[keys]
prefix = "ctrl+b"
help = "prefix+?"
settings = "prefix+comma"
detach = "prefix+d"
reload_config = "prefix+r"
goto = "prefix+t"
new_tab = "prefix+c"
previous_tab = "prefix+p"
next_tab = "prefix+n"
switch_tab = "prefix+1..9"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_horizontal = "prefix+s"
split_vertical = "prefix+v"
close_pane = "prefix+x"
zoom = "prefix+z"
resize_mode = "prefix+shift+r"
toggle_sidebar = "prefix+b"

# Equivalent to tmux-resurrect save/restore shortcuts.
[[keys.command]]
key = "prefix+ctrl+s"
type = "plugin_action"
command = "ntindle.herdr-resurrect.save"
description = "resurrect: save snapshot"

[[keys.command]]
key = "prefix+ctrl+r"
type = "plugin_action"
command = "ntindle.herdr-resurrect.restore"
description = "resurrect: restore snapshot"

[ui]
sidebar_start_collapsed = true
sidebar_collapsed_mode = "compact"
mouse_capture = true
copy_on_select = true
prompt_new_tab_name = false
pane_borders = "auto"
pane_outer_borders = false
pane_scrollbars = false
pane_gaps = false
tab_bar_position = "top"
tab_bar_right = [
  { type = "hostname" },
  { type = "command", command = "basename \"$PWD\"", interval_seconds = 2, timeout_seconds = 1 },
  { type = "datetime", format = "%H:%M" },
]
tab_bar_right_separator = " · "
status_indicators = "symbols"

# Match the tmux-side vim-tmux-navigator behavior. The helper passes
# Ctrl-h/j/k/l through to Neovim and moves Herdr focus elsewhere.
[[keys.command]]
key = "ctrl+h"
type = "shell"
command = "vim-herdr-navigator dispatch left"
description = "vim-aware pane left"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = "vim-herdr-navigator dispatch down"
description = "vim-aware pane down"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = "vim-herdr-navigator dispatch up"
description = "vim-aware pane up"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = "vim-herdr-navigator dispatch right"
description = "vim-aware pane right"

[ui.toast]
delivery = "terminal"
delay_seconds = 1

[session]
resume_agents_on_restore = true

# Closest match to @resurrect-capture-pane-contents='on'.
# Security note: this persists terminal text, which may include secrets.
[experimental]
pane_history = true
